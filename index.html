<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabVault</title>
<style>
  body { margin: 0 auto; max-width: 680px; padding: 64px 24px;
         font: 16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f7f7f5; color: #1a1a1a; }
  h1 { font-size: 24px; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { color: #555; }
  code { background: #fff; border: 1px solid #e2e2dc; border-radius: 6px; padding: 1px 6px; }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #ececec; }
    p { color: #a0a0a0; }
    code { background: #1c1c1c; border-color: #2e2e2e; }
  }
</style>
</head>
<body>
  <h1>TabVault</h1>
  <p>Keeps one window, archives every other window into a list you own.
     Manifest V3, no build step, no accounts, MIT.</p>
  <p>Shared collections live under <code>/s/&lt;id&gt;.html</code>.</p>
  <p><a href="https://github.com/volosati-team/tabvault">Source</a></p>
</body>
</html>
